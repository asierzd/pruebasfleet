apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-demo
  namespace: fleet-demo
  annotations:
    # Actualiza este valor junto con configmap.yaml para que K8s reinicie el pod.
    # Fleet aplicará ambos cambios; el nuevo pod mostrará la nueva versión.
    fleet-demo/config-version: "1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fleet-demo
  template:
    metadata:
      labels:
        app: fleet-demo
      annotations:
        fleet-demo/config-version: "1.0"
    spec:
      initContainers:
        - name: init-html
          image: busybox:stable
          command:
            - /bin/sh
            - -c
            - |
              cat > /html/index.html <<HTMLEOF
              <html><body>
              <h1>Fleet Demo</h1>
              <p><b>Version:</b> $FLEET_VERSION</p>
              <p><b>Message:</b> $FLEET_MESSAGE</p>
              </body></html>
              HTMLEOF
          env:
            - name: FLEET_VERSION
              valueFrom:
                configMapKeyRef:
                  name: fleet-demo-config
                  key: version
            - name: FLEET_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: fleet-demo-config
                  key: message
          volumeMounts:
            - name: html
              mountPath: /html
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-demo
  namespace: fleet-demo
spec:
  selector:
    app: fleet-demo
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
